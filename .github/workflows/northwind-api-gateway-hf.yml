name: Deploy Northwind Api Gateway to Hugging Face

env:
  PROJECT_PATH: nestjs/northwind
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_USERNAME: ${{ secrets.HF_USERNAME }}
  HF_SPACE_NAME: ${{ secrets.HF_SPACE_NORTHWIND_API_GATEWAY }}
  REPO_ID: ${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NORTHWIND_API_GATEWAY }}

on:
  push:
    branches:
      - main
      - feature/54-northwind-hf
    paths:
      - 'nestjs/northwind/apps/apigateway/**'
      - 'nestjs/northwind/libs/**'
  workflow_dispatch:

jobs:
  upload-to-hf:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface_hub

    - name: Configure npm for GitHub Packages
      run: |
        echo "Project path: $PROJECT_PATH"
        echo "Creating .npmrc in project path..."
        echo "@bibhu2020:registry=https://npm.pkg.github.com" > $PROJECT_PATH/.npmrc
        echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> $PROJECT_PATH/.npmrc

        echo "✅ .npmrc file created at:"
        realpath $PROJECT_PATH/.npmrc

        echo "📂 Listing directory contents:"
        ls -la $PROJECT_PATH
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    - name: Generate Dockerfile for Northwind API Gateway
      run: |
        cat << 'EOF' > $PROJECT_PATH/Dockerfile
        # Use an official Node.js runtime as a parent image
        FROM node:20-alpine AS builder

        # Set working directory
        WORKDIR /app

        # Install dependencies
        COPY package*.json ./
        RUN npm install

        # Copy the rest of the app's source code
        COPY . .

        # Build the NestJS app
        RUN npm run build:apigateway

        # Start the application
        CMD ["node", "dist/apps/apigateway/main.js"]

        # Expose app port
        EXPOSE 8080
        EOF

    - name: Verify Dockerfile
      run: |
        echo "Dockerfile contents:"
        cat $PROJECT_PATH/Dockerfile
    
    - name: Generate README.md for Northwind API Gateway
      run: |
        cat << 'EOF' > $PROJECT_PATH/README.md
        ---
        title: Northwind API Gateway
        emoji: 🐳
        colorFrom: blue
        colorTo: indigo
        sdk: docker
        app_file: app.py
        pinned: false
        ---

        # 🐳 Northwind API Gateway

        Dockerized NestJS API Gateway for the Northwind dataset, running on Node.js 20 and exposing port 8080.
        EOF    

    - name: Create upload script
      run: |
        cat << 'EOF' > upload_to_hf.py
        from huggingface_hub import HfApi, create_repo, HfFolder
        import os
        import sys
        from pathlib import Path

        # Get environment variables
        PROJECT_PATH = os.environ["PROJECT_PATH"]
        REPO_ID = os.environ["REPO_ID"]
        TOKEN = os.environ["HF_TOKEN"]

        def should_exclude(path):
            """Check if a file or directory should be excluded from upload"""
            exclusions = {
                '.env', '.env.*', '.venv', 'venv', 
                '__pycache__', '*.pyc', '.git',
                '.pytest_cache', '.coverage', "dockers"
            }

            path_parts = Path(path).parts
            return any(
                any(part.startswith(excl.replace('*', '')) for part in path_parts)
                for excl in exclusions
            )

        def main():
            # Initialize Hugging Face API
            HfFolder.save_token(TOKEN)  # Authenticate in CI/CD
            api = HfApi()

            # Create the Space repository if it doesn't exist
            try:
                create_repo(
                    repo_id=REPO_ID,
                    token=TOKEN,
                    repo_type="space",
                    space_sdk="docker",  # Must specify docker, gradio, streamlit, or static
                    private=False
                )
                print(f"Created new repository: {REPO_ID}")
            except Exception as e:
                if "You already created this space" in str(e):
                    print(f"Repository {REPO_ID} already exists")
                else:
                    print(f"Error creating repository: {e}")
                    sys.exit(1)

            # Upload folder with exclusions
            try:
                print(f"Uploading files to {REPO_ID}...")
                api.upload_folder(
                    folder_path=PROJECT_PATH,
                    repo_id=REPO_ID,
                    repo_type="space",
                    token=TOKEN,
                    ignore_patterns=[
                        ".env*",
                        ".venv/**",
                        "venv/**",
                        "__pycache__/**",
                        "*.pyc",
                        ".git/**",
                        ".pytest_cache/**",
                        ".coverage",
                        "dockers/**",
                    ],
                )
                print("Upload completed successfully")
            except Exception as e:
                print(f"Error uploading files: {e}")
                sys.exit(1)

        if __name__ == "__main__":
            main()
        EOF

    - name: Check files in libs/proto
      run: |
        echo "Listing $PROJECT_PATH recursively:"
        ls -R $PROJECT_PATH

        
    - name: Upload to Hugging Face Hub
      run: python upload_to_hf.py
